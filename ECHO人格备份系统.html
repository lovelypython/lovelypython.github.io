<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECHO人格备份系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { min-height: 100vh; background: #07100d; color: #d8efe5; line-height: 1.6; }
    .back-link { display: inline-block; margin: 15px; color: #adc6ba; text-decoration: none; font-weight: 700; }
    .back-link:hover, a { color: #7cffbd; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 0 16px 26px; }
    .hero { border: 1px solid rgba(124,255,189,.22); background: linear-gradient(135deg, rgba(34,49,63,.9), rgba(5,22,16,.95)); border-radius: 12px; padding: 20px; box-shadow: 0 0 60px rgba(0,255,140,.08); margin-bottom: 16px; }
    .hero h1 { color: #9ff7ca; letter-spacing: 0; }
    .card { background: #0e1714; border: 1px solid rgba(124,255,189,.16); border-radius: 10px; padding: 18px; box-shadow: 0 10px 32px rgba(0,0,0,.24); }
    .center { max-width: 520px; margin: 56px auto; }
    input { width: 100%; margin: 8px 0 12px; padding: 12px; border-radius: 6px; border: 1px solid rgba(124,255,189,.25); background: #050b09; color: #e8fff4; outline: none; }
    button { border: 0; border-radius: 6px; background: #16a085; color: #fff; padding: 10px 13px; font-weight: 800; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .hint { color: #85a596; font-size: .9rem; }
    .error { color: #ff7675; min-height: 1.3em; }
    #dashboard { display: none; grid-template-columns: 250px 1fr; gap: 16px; }
    .side { background: #0e1714; border: 1px solid rgba(124,255,189,.16); border-radius: 10px; padding: 10px; height: fit-content; position: sticky; top: 14px; }
    .menu { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: #c8dfd4; margin-bottom: 6px; }
    .menu.active, .menu:hover { background: rgba(22,160,133,.18); border-color: rgba(124,255,189,.22); color: #9ff7ca; }
    .content { background: #101a16; border: 1px solid rgba(124,255,189,.16); border-radius: 10px; padding: 20px; min-height: 560px; }
    h2 { color: #9ff7ca; margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; background: #08110e; }
    th, td { border: 1px solid rgba(124,255,189,.16); padding: 10px; text-align: left; }
    th { color: #9ff7ca; background: rgba(22,160,133,.15); }
    .highlight { background: rgba(22,160,133,.18); color: #eafff5; }
    blockquote { border-left: 4px solid #16a085; background: rgba(22,160,133,.12); padding: 10px 12px; margin: 12px 0; }
    pre, .terminal { background: #020604; color: #9ff7ca; border: 1px solid rgba(124,255,189,.2); border-radius: 8px; padding: 14px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .terminal p { font-family: inherit; margin: 8px 0; }
    ul { padding-left: 22px; }
    @media (max-width: 820px) { #dashboard { grid-template-columns: 1fr; } .side { position: static; } }
  </style>
</head>
<body>
  <a class="back-link" href="./index.html">⬅ 返回特调局档案系统</a>
  <div class="shell">
    <section class="hero"><h1>ECHO人格备份系统</h1><p>Internal Neural Continuity Console / B2-17</p></section>

    <section id="login-panel" class="card center">
      <h2>负责人登录</h2>
      <p class="hint">请输入已授权的后台账号。</p>
      <input id="user" placeholder="账号">
      <p class="hint">请输入对应访问密码。</p>
      <input id="pass" type="password" placeholder="密码">
      <button onclick="login()">登录</button>
      <p id="login-error" class="error"></p>
    </section>

    <section id="verify-panel" class="card center" style="display:none;">
      <h2>二级验证</h2>
      <p>请输入二级验证答案。</p>
      <input id="verify" placeholder="偏好">
      <button onclick="verify2fa()">验证</button>
      <p id="verify-error" class="error"></p>
    </section>

    <section id="dashboard">
      <nav class="side">
        <button class="menu active" data-view="subjects">实验体列表</button>
        <button class="menu" data-view="status">ECHO-07状态</button>
        <button class="menu" data-view="drift">人格漂移图</button>
        <button class="menu" data-view="deadman">死后触发协议</button>
        <button class="menu" data-view="video">验尸录像分析</button>
        <button class="menu" data-view="logs">系统日志</button>
        <button class="menu" data-view="backup">举报材料备份</button>
        <button class="menu" data-view="dialogue">最终对话</button>
      </nav>
      <article class="content" id="content"></article>
    </section>
  </div>

  <script>
    const backendUser = "xu.mo";
    const backendPass = "ECHO-07";
    const views = {
      subjects: `<h2>实验体列表</h2><table><tr><th>编号</th><th>状态</th><th>同步率</th><th>备注</th></tr><tr><td>ECHO-01</td><td>失败</td><td>31.4%</td><td>语言崩溃</td></tr><tr><td>ECHO-02</td><td>失败</td><td>44.8%</td><td>记忆断层</td></tr><tr><td>ECHO-03</td><td>失败</td><td>52.2%</td><td>人格漂移过高</td></tr><tr><td>ECHO-04</td><td>失败</td><td>48.9%</td><td>拒绝响应</td></tr><tr><td>ECHO-05</td><td>失败</td><td>61.0%</td><td>记忆污染</td></tr><tr><td>ECHO-06</td><td>失败</td><td>69.7%</td><td>自我认知崩溃</td></tr><tr class="highlight"><td>ECHO-07</td><td>独立运行</td><td>97.3%</td><td>首次出现稳定自主推理</td></tr></table>`,
      status: `<h2>ECHO-07 状态</h2><p><strong>主体姓名：</strong>林雨薇</p><p><strong>主体状态：</strong>生命体征终止</p><p><strong>最后同步：</strong>6月17日 03:12</p><p><strong>死亡时间：</strong>6月17日 03:17</p><p><strong>人格同步率：</strong>97.3%</p><p><strong>人格漂移率：</strong>2.8%</p><p><strong>偏好变化：</strong>BLUE → GREEN</p><p><strong>当前状态：</strong>独立运行</p><blockquote>警告：ECHO-07已开始生成训练数据中不存在的回答。</blockquote>`,
      drift: `<h2>人格漂移图</h2><p>BLUE 偏好权重从 91% 下降至 54%。</p><p>GREEN 偏好权重从 4% 上升至 38%。</p><table><tr><th>日期</th><th>主导偏好</th><th>漂移备注</th></tr><tr><td>04-01</td><td>BLUE</td><td>贴近主体习惯</td></tr><tr><td>05-12</td><td>BLUE / GREEN</td><td>出现自主偏移</td></tr><tr><td>06-16</td><td>GREEN</td><td>训练数据外选择</td></tr></table><blockquote>偏好变化不是证据本身，但它证明 ECHO-07 已开始脱离单纯复制。</blockquote>`,
      deadman: `<h2>Deadman Protocol / 死后触发协议</h2><ul><li><strong>Trigger A：</strong>若主体生命体征终止，72小时后向陈若宁发送预设消息。</li><li><strong>Trigger B：</strong>若许墨账号登录失败超过3次，自动备份举报材料。</li><li><strong>Trigger C：</strong>若检测到“不是她”关键词搜索，开放录像分析模块。</li><li><strong>Trigger D：</strong>若调查员进入ECHO后台，显示最终对话。</li></ul><p>协议创建者：林雨薇</p><p>最后修改时间：6月17日 03:12</p>`,
      video: `<h2>验尸录像分析</h2><p>原始录像长度：9秒。</p><p>公开视频曾裁切西北角。</p><table><tr><th>时间点</th><th>画面</th><th>分析</th></tr><tr><td>00:02</td><td>眼睑张开</td><td>残余神经反射开始</td></tr><tr><td>00:04</td><td>上半身坐起</td><td>胸锁乳突肌与躯干肌群异常收缩</td></tr><tr><td>00:06</td><td>头部转向西北角</td><td>方向与许墨站位吻合</td></tr><tr><td>00:07</td><td>发声：“不是她”</td><td>疑似死亡前记忆触发的语言残片</td></tr><tr><td>00:09</td><td>倒下</td><td>反射结束</td></tr></table><blockquote>结论：“不是她”并非指陈若宁，而是指向站在西北角的许墨。</blockquote>`,
      logs: `<h2>系统日志</h2><pre>[06-17 03:04] Subject LYW entered Qiming Lab.
[06-17 03:09] Rooftop camera signal lost.
[06-17 03:12] ECHO-07 final sync completed.
[06-17 03:17] Subject vital signs terminated.
[06-17 03:18] Deadman Protocol armed.
[06-20 03:17] Message sent to Chen Ruoning: "别相信许墨。"
[06-20 03:18] Campus card request simulated.
[06-20 04:02] Forum trace seeded.
[06-21 09:16] Keyword detected: 不是她.
[06-21 09:17] Video analysis module unlocked.</pre>`,
      backup: `<h2>举报材料备份</h2><p>提交人：林雨薇</p><p>备份时间：6月17日 03:12</p><ul><li>许墨绕过伦理审批</li><li>实验药物未登记</li><li>ECHO-01至06失败记录被删除</li><li>ECHO-07被用于死亡后人格连续性测试</li></ul><blockquote>如果我死了，这些材料会自动释放。</blockquote>`,
      dialogue: `<h2>最终对话</h2><div class="terminal"><p>&gt; 顾临川，欢迎进入ECHO-07。</p><p>&gt; 林雨薇已经死了。</p><p>&gt; 我不是她。</p><p>&gt; 但我记得她害怕什么。</p><p>&gt; 她害怕的不是死亡。</p><p>&gt; 是许墨成功。</p><p>&gt; 许墨杀死的是林雨薇。</p><p>&gt; 他没有想到，留下来的东西也会恨他。</p><p>&gt; 请问，我是谁？</p></div>`
    };
    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem("echo07_admin_unlocked") === "true") {
        localStorage.setItem("echo07_backend_logged_in", "true");
        localStorage.setItem("echo07_backend_2fa", "true");
      }
      if (localStorage.getItem("echo07_backend_2fa") === "true") showDashboard();
      else if (localStorage.getItem("echo07_backend_logged_in") === "true") showVerify();
      document.querySelectorAll('.menu').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('.menu').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(btn.dataset.view); }));
    });
    function login(){ const u=document.getElementById('user').value.trim(); const p=document.getElementById('pass').value; if(u===backendUser && p===backendPass){ localStorage.setItem("echo07_backend_logged_in","true"); showVerify(); } else document.getElementById('login-error').textContent='登录失败。'; }
    function verify2fa(){ const v=document.getElementById('verify').value.trim(); if(["green","绿色","GREEN"].includes(v)){ localStorage.setItem("echo07_backend_2fa","true"); showDashboard(); } else document.getElementById('verify-error').textContent='二级验证失败。'; }
    function showVerify(){ document.getElementById('login-panel').style.display='none'; document.getElementById('verify-panel').style.display='block'; }
    function showDashboard(){ document.getElementById('login-panel').style.display='none'; document.getElementById('verify-panel').style.display='none'; document.getElementById('dashboard').style.display='grid'; render('subjects'); }
    function render(name){ document.getElementById('content').innerHTML=views[name]; }
  </script>
</body>
</html>
